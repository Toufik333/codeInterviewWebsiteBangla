<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CTCI Prep — Minimalist Dark Learning Platform</title>
  <meta name="description" content="Master Cracking the Coding Interview with structured learning tracks, interactive quizzes, progress milestone tracking, and cloud account synchronization." />
  <meta name="keywords" content="CTCI, Cracking the Coding Interview, learning tracks, data structures, algorithms, system design, coding interview, cloud progress" />
  <meta name="author" content="CTCI Prep Platform" />
  <meta name="theme-color" content="#0A0A0F" />

  <!-- Open Graph -->
  <meta property="og:title" content="CTCI Prep — Track-Based Coding Interview Platform" />
  <meta property="og:description" content="4 comprehensive learning tracks, interactive quizzes, and persistent cloud progress tracking." />
  <meta property="og:type" content="website" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />

  <!-- Google Fonts: Space Grotesk (Headlines), Inter (Body), JetBrains Mono (Code & Numbers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient Atmospheric Glow Orbs -->
  <div class="ambient-glow-orb ambient-orb-top" aria-hidden="true"></div>
  <div class="ambient-glow-orb ambient-orb-bottom" aria-hidden="true"></div>

  <!-- App Mount Point -->
  <div id="app"></div>

  <!-- Global Modals & Overlay Container -->
  <div id="modalContainer" class="modal-backdrop" aria-hidden="true"></div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Scripts: Data -> Storage -> App Controller -->
  <script src="data.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
